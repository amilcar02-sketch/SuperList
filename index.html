function ordered(items){let names=[...categories,...new Set(items.map(x=>x.category).filter(c=>!categories.includes(c)))];return names.map(cat=>[cat,items.filter(x=>x.category===cat)]).filter(([,xs])=>xs.length)}
function renderRows(items,mode){return ordered(items).map(([cat,xs])=>{let key=mode+':'+cat,closed=!!folded[key];return `<section class="category"><button class="cathead" data-act="fold" data-key="${escape(key)}" aria-expanded="${!closed}">${icons[cat]||'🛍️'} ${escape(cat)} <span class="cat-count">${xs.length}</span><span class="chevron">${closed?'›':'⌄'}</span></button>${closed?'':xs.map(x=>`<div class="row ${x.status==='bought'?'bought':''}">${mode==='catalog'?`<button class="menu" data-act="edit" data-id="${escape(x.id)}" aria-label="Editar ${escape(x.name)}">⋯</button>`:`<button class="circle ${x.status==='bought'?'done':''}" data-act="${x.status==='bought'?'undo':'buy'}" data-id="${escape(x.id)}" aria-label="${x.status==='bought'?'Desmarcar':'Marcar comprado'} ${escape(x.name)}">${x.status==='bought'?'✓':''}</button>`}<div class="name">${escape(x.name)}${x.note?`<small>${escape(x.note)}</small>`:''}</div>${mode==='catalog'?(x.status==='catalog'?`<button class="add" data-act="add" data-id="${escape(x.id)}" aria-label="Agregar ${escape(x.name)}">+</button>`:`<button class="added" data-act="${x.status==='bought'?'readd':'remove'}" data-id="${escape(x.id)}">${x.status==='bought'?'↻ Reponer':'✓ En lista'}</button>`):`<span class="mini">${escape(x.qty||'1 unidad')}</span><button class="menu" data-act="edit" data-id="${escape(x.id)}" aria-label="Editar ${escape(x.name)}">⋯</button>`}</div>`).join('')}</section>`}).join('')}
function render(){let pending=data.filter(x=>x.status==='list'),bought=data.filter(x=>x.status==='bought');$('title').textContent=view==='list'?'Lista de compra':'Mis productos';$('subtitle').textContent=view==='list'?'Tu compra, organizada':'Tu lista habitual';$('tabList').classList.toggle('active',view==='list');$('tabCatalog').classList.toggle('active',view==='catalog');$('tabList').setAttribute('aria-current',view==='list'?'page':'false');$('tabCatalog').setAttribute('aria-current',view==='catalog'?'page':'false');if(view==='list'){let total=pending.length+bought.length,pct=total?Math.round(bought.length/total*100):0;$('content').innerHTML=`<div class="summary"><div><b>${pending.length} pendientes</b><br><span>${bought.length} comprados</span><div class="bar" style="width:190px;max-width:55vw"><div class="fill" style="width:${pct}%"></div></div></div><b style="font-size:16px">${pct}%</b></div>${pending.length?renderRows(pending,'list'):`<div class="empty"><div class="emoji">🛒</div><strong>${bought.length?'¡Compra completada!':'Tu lista está vacía'}</strong><div>Elige productos de tu catálogo para empezar.</div><button data-act="goCatalog">Ver mis productos</button></div>`}${bought.length?`<h2 style="margin:28px 2px 8px">Comprados (${bought.length})</h2><p class="sub">Desmarca uno si aún lo necesitas.</p>${renderRows(bought,'bought')}<button class="primary" style="width:100%;background:#3b3323;color:#f4bd54;margin-top:10px" data-act="finish">Finalizar compra · volver al catálogo</button>`:''}<div class="action-zone"><button class="primary" data-act="new">＋ Agregar producto</button></div>`}else{let matches=data.filter(x=>norm(x.name).includes(norm(query)));$('content').innerHTML=`<input class="search" id="search" type="search" placeholder="Buscar productos" value="${escape(query)}" aria-label="Buscar productos"><button class="copy-btn" data-act="copy">▣ &nbsp; Copiar mis productos</button>${matches.length?renderRows(matches,'catalog'):`<div class="empty"><div class="emoji">🧺</div><strong>${query?'No encontramos ese producto':'Tu catálogo está vacío'}</strong><div>${query?'Prueba otra búsqueda.':'Agrega productos para armar tu lista habitual.'}</div></div>`}<div class="action-zone"><button class="primary" data-act="new">＋ Agregar producto</button></div>`;const input=$('search');input.addEventListener('input',()=>{let start=input.selectionStart;query=input.value;render();$('search').focus();$('search').setSelectionRange(start,start)})}}
function openForm(x){editing=x?.id||null;$('formTitle').textContent=x?'Editar producto':'Agregar producto';$('submit').textContent=x?'Guardar cambios':'Guardar producto';$('product').value=x?.name||'';$('category').innerHTML=categories.map(c=>`<option>${escape(c)}</option>`).join('');$('category').value=x?.category||'Otros';$('qty').value=x?.qty||'1 unidad';$('note').value=x?.note||'';$('suggestion').classList.add('hidden');$('modal').classList.remove('hidden');setTimeout(()=>$('product').focus(),80)}
function closeForm(){$('modal').classList.add('hidden');editing=null}
async function copyProducts(){let lines=ordered(data).map(([cat,xs])=>cat+'\n'+xs.map(x=>'• '+x.name+(x.qty&&x.qty!=='1 unidad'?' — '+x.qty:'')+(x.note?' ('+x.note+')':'')).join('\n')).join('\n\n');try{await navigator.clipboard.writeText(lines);showToast('✓ Listado copiado')}catch{let t=document.createElement('textarea');t.value=lines;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();showToast(ok?'✓ Listado copiado':'No se pudo copiar. Abre el HTML en Safari')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id,x=data.find(y=>y.id===id);if(act==='new'){openForm();return}if(act==='copy'){copyProducts();return}if(act==='fold'){folded[b.dataset.key]=!folded[b.dataset.key];try{localStorage.setItem(FOLD_KEY,JSON.stringify(folded))}catch{}render();return}if(act==='goCatalog'){view='catalog';render();return}if(act==='finish'){if(!confirm('¿Finalizar esta compra? Los productos comprados quedarán disponibles en Mis productos.'))return;data.forEach(y=>{if(y.status==='bought')y.status='catalog'});save();render();showToast('Compra finalizada');return}if(!x)return;if(act==='edit'){openForm(x);return}if(act==='add'||act==='readd'){x.status='list';showToast('Agregado a la compra')}if(act==='remove'){x.status='catalog';showToast('Quitado de la compra')}if(act==='buy'){x.status='bought';showToast('Marcado como comprado')}if(act==='undo'){x.status='list';showToast('De nuevo pendiente')}save();render()});
$('newTop').onclick=()=>openForm();$('close').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('tabList').onclick=()=>{view='list';query='';render()};$('tabCatalog').onclick=()=>{view='catalog';render()};$('product').addEventListener('input',()=>{if(editing)return;let name=$('product').value,c=guess(name);$('suggestion').textContent=`Sugerencia: ${c}`;$('suggestion').classList.toggle('hidden',!name.trim());$('category').value=c});$('form').addEventListener('submit',e=>{e.preventDefault();let name=$('product').value.trim(),category=$('category').value,qty=$('qty').value.trim()||'1 unidad',note=$('note').value.trim();if(!name)return;let duplicate=data.find(x=>x.id!==editing&&norm(x.name)===norm(name)&&x.category===category);if(duplicate){showToast('Ese producto ya existe');return}let wasEditing=!!editing;if(editing){let x=data.find(y=>y.id===editing);Object.assign(x,{name,category,qty,note})}else data.push({id:newId(),name,category,qty,note,status:'catalog'});save();closeForm();render();showToast(wasEditing?'Producto actualizado':'Producto guardado')});render()})();
</script></body></html>
